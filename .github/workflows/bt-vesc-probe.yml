name: BT VESC GEORGE OPT6 build

on:
  push:
    branches:
      - bt-vesc-george-opt-build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact GEORGE 0.4 source
        uses: actions/checkout@v4
        with:
          repository: bwoodill/BT_VESC
          ref: v2.3_GEORGE_0.4
          path: BT_VESC
          fetch-depth: 1

      - name: Download official GEORGE 0.4 binary
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 3 -o /tmp/v2.3_george_0.4.zip \
            https://github.com/bwoodill/BT_VESC/releases/download/v2.3/v2.3_george_0.4.zip
          mkdir -p /tmp/george
          unzip -q /tmp/v2.3_george_0.4.zip -d /tmp/george
          echo '26af733e32659ce15542ba67d8a0a3cc78dd008ecab4933fea6541390e247958  /tmp/george/BLDC_4_BT_VESC.bin' | sha256sum -c -

      - name: Install exact ARM GCC 7-2018-q2
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://developer.arm.com/-/media/Files/downloads/gnu-rm/7-2018q2/gcc-arm-none-eabi-7-2018-q2-update-linux.tar.bz2'
          curl -L --retry 3 -o /tmp/gcc-arm-none-eabi.tar.bz2 "$URL"
          echo 'bb17109f0ee697254a5d4ae6e5e01440e3ea8f0277f2e8169bf95d07c7d5fe69  /tmp/gcc-arm-none-eabi.tar.bz2' | sha256sum -c -
          mkdir -p "$HOME/toolchains"
          tar -xjf /tmp/gcc-arm-none-eabi.tar.bz2 -C "$HOME/toolchains"
          echo "$HOME/toolchains/gcc-arm-none-eabi-7-2018-q2-update/bin" >> "$GITHUB_PATH"

      - name: Prove clean source reproduces official binary
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchains/gcc-arm-none-eabi-7-2018-q2-update/bin:$PATH"
          cd BT_VESC
          make clean || true
          make -j2
          test "$(sha256sum build/BLDC_4_BT_VESC.bin | cut -d' ' -f1)" = "26af733e32659ce15542ba67d8a0a3cc78dd008ecab4933fea6541390e247958"
          cmp -s build/BLDC_4_BT_VESC.bin /tmp/george/BLDC_4_BT_VESC.bin
          echo "Baseline reproduction: EXACT MATCH"

      - name: Apply OPT6 source modifications
        shell: bash
        run: |
          set -euxo pipefail
          cd BT_VESC
          python3 - <<'PY'
          from pathlib import Path

          def read_lines(path):
              return Path(path).read_text().splitlines(keepends=True)

          def write_lines(path, lines):
              Path(path).write_text(''.join(lines))

          def find_line(lines, stripped, start=0):
              hits = [i for i in range(start, len(lines)) if lines[i].strip() == stripped]
              if len(hits) != 1:
                  raise SystemExit(f"{stripped!r}: expected one line after {start}, got {hits}")
              return hits[0]

          def find_first(lines, stripped, start=0):
              for i in range(start, len(lines)):
                  if lines[i].strip() == stripped:
                      return i
              raise SystemExit(f"{stripped!r}: line not found after {start}")

          def replace_text_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if s.count(old) != 1:
                  raise SystemExit(f"{path}: expected one {old!r}, got {s.count(old)}")
              p.write_text(s.replace(old, new, 1))

          # Identify build.
          replace_text_once(
              "applications/app_version.h",
              '#define APP_VERSION "BT_VESC VERSION 2.3 GEORGE 0.4"',
              '#define APP_VERSION "BT_VESC VERSION 2.3 GEORGE 0.4 OPT6"'
          )

          # User's known-good BT_VESC settings as compiled defaults.
          defaults = Path("applications/defaults.h")
          s = defaults.read_text()
          pairs = [
              ("#define TRIG_ON_TOUT_MS 400", "#define TRIG_ON_TOUT_MS 800"),
              ("#define TRIG_OFF_TOUT_MS 500", "#define TRIG_OFF_TOUT_MS 900"),
              ("#define SPEED_DEFAULT 3", "#define SPEED_DEFAULT 2"),
              ("#define SPEEDS1 1525", "#define SPEEDS1 1975"),
              ("#define SPEEDS2 2300", "#define SPEEDS2 2175"),
              ("#define SPEEDS3 3100", "#define SPEEDS3 2350"),
              ("#define SPEEDS4 3525", "#define SPEEDS4 2525"),
              ("#define SPEEDS5 3900", "#define SPEEDS5 2950"),
              ("#define SPEEDS6 4150", "#define SPEEDS6 3250"),
              ("#define SPEEDS7 4450", "#define SPEEDS7 3975"),
              ("#define SPEEDS8 4850", "#define SPEEDS8 4150"),
              ("#define SPEEDS9 5000", "#define SPEEDS9 4700"),
              ("#define LIMITS1 1", "#define LIMITS1 1.75"),
              ("#define LIMITS2 2.2", "#define LIMITS2 2.00"),
              ("#define LIMITS3 3.8", "#define LIMITS3 2.40"),
              ("#define LIMITS4 6.2", "#define LIMITS4 3.00"),
              ("#define LIMITS5 9.6", "#define LIMITS5 4.50"),
              ("#define LIMITS6 12.8", "#define LIMITS6 6.00"),
              ("#define LIMITS7 17", "#define LIMITS7 9.20"),
              ("#define LIMITS8 22.8", "#define LIMITS8 12.50"),
              ("#define LIMITS9 23", "#define LIMITS9 20.00"),
              ("#define CRUISE 0", "#define CRUISE 1"),
              ("#define LOW_MIGRATE 0", "#define LOW_MIGRATE 1"),
          ]
          for old, new in pairs:
              if s.count(old) != 1:
                  raise SystemExit(f"applications/defaults.h: expected one {old!r}, got {s.count(old)}")
              s = s.replace(old, new, 1)
          defaults.write_text(s)

          # Two-sample physical trigger debounce at the existing 40 Hz scan.
          p = "applications/app_sikorski.c"
          L = read_lines(p)
          i = find_line(L, "static uint8_t sw = 1;")
          if L[i+1].strip() != "bool trigger_pressed = false;":
              raise SystemExit("unexpected trigger declaration layout")
          L[i:i+2] = [
              "    // Two-sample debounce at the existing 40 Hz scan rate (~25-50 ms).\n",
              "    static uint8_t raw_last = 1;\n",
              "    static uint8_t stable_state = 1;\n",
              "    static uint8_t stable_count = 0;\n",
              "    bool trigger_pressed = false;\n",
          ]
          start = find_line(L, "trigger_pressed = palReadPad(HW_ICU_GPIO, HW_ICU_PIN);")
          end = find_first(L, "int i = 0;", start + 1)
          L[start:end] = [
              "        trigger_pressed = palReadPad(HW_ICU_GPIO, HW_ICU_PIN) ? true : false;\n",
              "\n",
              "        uint8_t raw_now = trigger_pressed ? 1 : 0;\n",
              "        if (raw_now == raw_last)\n",
              "        {\n",
              "            if (stable_count < 2)\n",
              "                stable_count++;\n",
              "        }\n",
              "        else\n",
              "        {\n",
              "            raw_last = raw_now;\n",
              "            stable_count = 1;\n",
              "        }\n",
              "\n",
              "        if (stable_count >= 2 && raw_last != stable_state)\n",
              "        {\n",
              "            stable_state = raw_last;\n",
              "            send_to_trigger (stable_state ? SW_PRESSED : SW_RELEASED);\n",
              "        }\n",
              "\n",
          ]
          write_lines(p, L)

          # Single-press start only. IMPORTANT: do not alter the original GEORGE
          # running click/shift state machine. While the user is doing a shift
          # gesture, motor output remains running exactly as in stock GEORGE.
          p = "applications/trigger.c"
          L = read_lines(p)
          off = find_line(L, "case SWST_OFF:")
          on = find_first(L, "case SWST_ON:", off + 1)
          L[off:on] = [
              "        case SWST_OFF:\n",
              "            if (event == SW_PRESSED)\n",
              "            {\n",
              "                // Single-press start.\n",
              "                state = SWST_ONE_ON;\n",
              "                timeout = TIME_INFINITE;\n",
              "                send_to_speed (SPEED_ON);\n",
              "            }\n",
              "            break;\n",
          ]
          write_lines(p, L)

          # Separate startup ramp from speed-change ramp without changing
          # trigger semantics. Startup remains $r; speed changes use 2x $r.
          p = "applications/speed.c"
          L = read_lines(p)
          i = find_line(L, "#define CHECK_BATTERY_PERIOD_MS 5000 // check the battery every 5 seconds while running")
          L[i+1:i+1] = [
              "\n",
              "// $r is the startup ramp; speed-level changes use 2x $r.\n",
              "static float ramp_multiplier = 1.0;\n",
          ]
          for j,x in enumerate(L):
              if "const float delta = ((float) settings->ramping)" in x:
                  L[j] = "    const float delta = (((float) settings->ramping) * ramp_multiplier) / (1000.0 / RAMPING_TIME_MS);\n"
                  break
          else:
              raise SystemExit("ramping delta not found")

          motor_off = find_line(L, "case MOTOR_OFF:")
          motor_on = find_first(L, "case MOTOR_ON:", motor_off + 1)
          motor_start = find_first(L, "case MOTOR_START: // wait here until it is indicated that we are running in water with no obstructions", motor_on + 1)

          # Startup/JUMP startup use normal $r.
          i = find_first(L, "case SPEED_ON:", motor_off + 1)
          L[i+1:i+1] = ["                ramp_multiplier = 1.0;\n"]
          i = find_first(L, "case JUMP_SPEED_START: //new jump speed", motor_off + 1)
          if i < motor_on:
              L[i+1:i+1] = ["                ramp_multiplier = 1.0;\n"]

          motor_on = find_first(L, "case MOTOR_ON:", motor_off + 1)
          motor_start = find_first(L, "case MOTOR_START: // wait here until it is indicated that we are running in water with no obstructions", motor_on + 1)

          # Speed-level changes use 2x $r.
          for case_name, anchor in [
              ("case SPEED_UP:", "increase (&user_speed);"),
              ("case SPEED_DOWN:", "decrease (&user_speed);"),
              ("case JUMP_SPEED: //new jump speed", "user_speed = settings->jump_speed -1;"),
          ]:
              ci = find_first(L, case_name, motor_on + 1)
              if ci >= motor_start:
                  raise SystemExit(f"{case_name} escaped MOTOR_ON")
              ai = find_first(L, anchor, ci + 1)
              L[ai+1:ai+1] = ["                ramp_multiplier = 2.0;\n"]

          # If safe-start is ever enabled, completion returns to startup ramp.
          i = find_first(L, "case SPEED_READY:   // READY thread approved start conditions", motor_start + 1)
          state_line = find_first(L, "state = MOTOR_ON;", i + 1)
          L[state_line+1:state_line+1] = ["                ramp_multiplier = 1.0;\n"]

          write_lines(p, L)
          print("OPT6 source modifications applied successfully.")
          PY

          git diff --check
          git diff > ../BT_VESC_GEORGE04_OPT6_SOURCE.diff

      - name: Static source assertions
        shell: bash
        run: |
          set -euxo pipefail
          cd BT_VESC
          grep -F 'BT_VESC VERSION 2.3 GEORGE 0.4 OPT6' applications/app_version.h
          grep -F 'stable_count >= 2' applications/app_sikorski.c
          grep -F 'send_to_speed (SPEED_ON);' applications/trigger.c
          grep -F 'case SWST_GOING_OFF:' applications/trigger.c
          grep -F 'send_to_speed (SPEED_DOWN);' applications/trigger.c
          grep -F 'send_to_speed (SPEED_UP);' applications/trigger.c
          ! grep -F 'SPEED_PAUSE' applications/trigger.c
          ! grep -F 'SPEED_RESUME' applications/trigger.c
          ! grep -F 'MOTOR_PAUSED' applications/speed.c
          grep -F 'ramp_multiplier = 2.0' applications/speed.c
          grep -F '#define SPEED_DEFAULT 2' applications/defaults.h
          grep -F '#define SPEEDS9 4700' applications/defaults.h
          grep -F '#define LIMITS9 20.00' applications/defaults.h
          grep -F '#define CRUISE 1' applications/defaults.h
          grep -F '#define LOW_MIGRATE 1' applications/defaults.h

      - name: Compile OPT6 HW60 firmware
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchains/gcc-arm-none-eabi-7-2018-q2-update/bin:$PATH"
          cd BT_VESC
          make clean
          make -j2
          cp build/BLDC_4_BT_VESC.bin ../BT_VESC_2.3_GEORGE0.4_OPT6_HW60.bin
          cd ..
          echo '=== FINAL OPT6 ==='
          sha256sum BT_VESC_2.3_GEORGE0.4_OPT6_HW60.bin
          stat -c '%n %s bytes' BT_VESC_2.3_GEORGE0.4_OPT6_HW60.bin
          strings BT_VESC_2.3_GEORGE0.4_OPT6_HW60.bin | grep -F 'BT_VESC VERSION 2.3 GEORGE 0.4 OPT6'

      - name: Create build notes
        shell: bash
        run: |
          cat > BT_VESC_GEORGE04_OPT6_BUILD_NOTES.txt <<'EOF'
          BT_VESC 2.3 GEORGE 0.4 OPT6 - HW60

          Base source: bwoodill/BT_VESC branch v2.3_GEORGE_0.4
          Base official binary SHA-256:
          26af733e32659ce15542ba67d8a0a3cc78dd008ecab4933fea6541390e247958

          Baseline validation:
          Clean source compiled with the exact GCC 7.3.1 toolchain reproduced the
          official GEORGE 0.4 binary byte-for-byte before modifications.

          OPT6 behavior:
          - Single press starts the motor.
          - Original GEORGE running click/shift state machine is preserved.
          - Motor remains running during the release/re-press sequence used to shift.
          - Motor stops only when the original trigger timeout decides the release was
            a true stop (with current $T 800 timing).
          - Two-sample trigger debounce at 40 Hz.
          - Startup ramp uses $r (1500 current setting).
          - Speed-level changes use 2x $r (3000 with current setting).
          - Migration begins only after a true SPEED_OFF, as in original GEORGE.
          - User's tuned settings are compiled as defaults.

          Bench test with prop removed/secured before water use.
          EOF

      - name: Upload final firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-vesc-george04-opt6
          path: |
            BT_VESC_2.3_GEORGE0.4_OPT6_HW60.bin
            BT_VESC_GEORGE04_OPT6_SOURCE.diff
            BT_VESC_GEORGE04_OPT6_BUILD_NOTES.txt
          if-no-files-found: error
