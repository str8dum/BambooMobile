name: BT VESC GEORGE SINGLE PRESS PRESET build

on:
  push:
    branches:
      - bt-vesc-george-opt-build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out exact GEORGE 0.4 source
        uses: actions/checkout@v4
        with:
          repository: bwoodill/BT_VESC
          ref: v2.3_GEORGE_0.4
          path: BT_VESC
          fetch-depth: 1

      - name: Download official GEORGE 0.4 binary
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 3 -o /tmp/v2.3_george_0.4.zip \
            https://github.com/bwoodill/BT_VESC/releases/download/v2.3/v2.3_george_0.4.zip
          mkdir -p /tmp/george
          unzip -q /tmp/v2.3_george_0.4.zip -d /tmp/george
          echo '26af733e32659ce15542ba67d8a0a3cc78dd008ecab4933fea6541390e247958  /tmp/george/BLDC_4_BT_VESC.bin' | sha256sum -c -

      - name: Install exact ARM GCC 7-2018-q2
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://developer.arm.com/-/media/Files/downloads/gnu-rm/7-2018q2/gcc-arm-none-eabi-7-2018-q2-update-linux.tar.bz2'
          curl -L --retry 3 -o /tmp/gcc-arm-none-eabi.tar.bz2 "$URL"
          echo 'bb17109f0ee697254a5d4ae6e5e01440e3ea8f0277f2e8169bf95d07c7d5fe69  /tmp/gcc-arm-none-eabi.tar.bz2' | sha256sum -c -
          mkdir -p "$HOME/toolchains"
          tar -xjf /tmp/gcc-arm-none-eabi.tar.bz2 -C "$HOME/toolchains"
          echo "$HOME/toolchains/gcc-arm-none-eabi-7-2018-q2-update/bin" >> "$GITHUB_PATH"

      - name: Prove clean source reproduces official binary
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchains/gcc-arm-none-eabi-7-2018-q2-update/bin:$PATH"
          cd BT_VESC
          make clean || true
          make -j2
          test "$(sha256sum build/BLDC_4_BT_VESC.bin | cut -d' ' -f1)" = "26af733e32659ce15542ba67d8a0a3cc78dd008ecab4933fea6541390e247958"
          cmp -s build/BLDC_4_BT_VESC.bin /tmp/george/BLDC_4_BT_VESC.bin
          echo "Baseline reproduction: EXACT MATCH"

      - name: Apply single-press start and preset defaults
        shell: bash
        run: |
          set -euxo pipefail
          cd BT_VESC
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              s=p.read_text()
              n=s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected 1 match for {old!r}, got {n}")
              p.write_text(s.replace(old,new,1))

          # Version identifier.
          replace_once(
              "applications/app_version.h",
              '#define APP_VERSION "BT_VESC VERSION 2.3 GEORGE 0.4"',
              '#define APP_VERSION "BT_VESC VERSION 2.3 GEORGE 0.4 SINGLE PRESET"'
          )

          # Only behavior change: first trigger press starts immediately.
          replace_once(
              "applications/trigger.c",
              """        case SWST_OFF:
            if (event == SW_PRESSED)
            {
                state = SWST_GOING_ON;
                timeout = MS2ST(settings->trig_on_time);
            }
            break;""",
              """        case SWST_OFF:
            if (event == SW_PRESSED)
            {
                state = SWST_ONE_ON;
                timeout = TIME_INFINITE;
                send_to_speed (SPEED_ON);
            }
            break;"""
          )

          # Compile the user's current BT_VESC tuning into reset defaults.
          p=Path("applications/defaults.h")
          s=p.read_text()
          pairs=[
              ("#define TRIG_ON_TOUT_MS 400", "#define TRIG_ON_TOUT_MS 800"),
              ("#define TRIG_OFF_TOUT_MS 500", "#define TRIG_OFF_TOUT_MS 900"),
              ("#define SPEED_DEFAULT 3", "#define SPEED_DEFAULT 2"),
              ("#define SPEEDS1 1525", "#define SPEEDS1 1975"),
              ("#define SPEEDS2 2300", "#define SPEEDS2 2175"),
              ("#define SPEEDS3 3100", "#define SPEEDS3 2350"),
              ("#define SPEEDS4 3525", "#define SPEEDS4 2525"),
              ("#define SPEEDS5 3900", "#define SPEEDS5 2950"),
              ("#define SPEEDS6 4150", "#define SPEEDS6 3250"),
              ("#define SPEEDS7 4450", "#define SPEEDS7 3975"),
              ("#define SPEEDS8 4850", "#define SPEEDS8 4150"),
              ("#define SPEEDS9 5000", "#define SPEEDS9 4700"),
              ("#define LIMITS1 1", "#define LIMITS1 1.75"),
              ("#define LIMITS2 2.2", "#define LIMITS2 2.00"),
              ("#define LIMITS3 3.8", "#define LIMITS3 2.40"),
              ("#define LIMITS4 6.2", "#define LIMITS4 3.00"),
              ("#define LIMITS5 9.6", "#define LIMITS5 4.50"),
              ("#define LIMITS6 12.8", "#define LIMITS6 6.00"),
              ("#define LIMITS7 17", "#define LIMITS7 9.20"),
              ("#define LIMITS8 22.8", "#define LIMITS8 12.50"),
              ("#define LIMITS9 23", "#define LIMITS9 20.00"),
              ("#define CRUISE 0", "#define CRUISE 1"),
              ("#define LOW_MIGRATE 0", "#define LOW_MIGRATE 1"),
          ]
          for old,new in pairs:
              if s.count(old)!=1:
                  raise SystemExit(f"defaults.h: expected 1 match for {old!r}, got {s.count(old)}")
              s=s.replace(old,new,1)
          p.write_text(s)

          print("Applied single-press start + tuned defaults.")
          PY

          git diff --check
          git diff > ../BT_VESC_GEORGE04_SINGLE_PRESS_PRESET_SOURCE.diff

      - name: Verify only intended source areas changed
        shell: bash
        run: |
          set -euxo pipefail
          cd BT_VESC
          grep -F 'BT_VESC VERSION 2.3 GEORGE 0.4 SINGLE PRESET' applications/app_version.h
          grep -F 'state = SWST_ONE_ON;' applications/trigger.c
          grep -F 'send_to_speed (SPEED_ON);' applications/trigger.c

          grep -F '#define USE_SAFETY_SPEED 0' applications/defaults.h
          grep -F '#define TRIG_ON_TOUT_MS 800' applications/defaults.h
          grep -F '#define TRIG_OFF_TOUT_MS 900' applications/defaults.h
          grep -F '#define SPEED_DEFAULT 2' applications/defaults.h
          grep -F '#define SPEED_RAMPING_RATE 1500' applications/defaults.h
          grep -F '#define MIGRATE_SPEED_MILLISECONDS 5000' applications/defaults.h
          grep -F '#define DISP_OFF_TRIG_DURATION_MS 6000' applications/defaults.h
          grep -F '#define CRUISE 1' applications/defaults.h
          grep -F '#define JUMP 0' applications/defaults.h
          grep -F '#define JUMP_SPEED 6' applications/defaults.h
          grep -F '#define LOW_MIGRATE 1' applications/defaults.h
          grep -F '#define REVERSE 0' applications/defaults.h

          grep -F '#define SPEEDS1 1975' applications/defaults.h
          grep -F '#define SPEEDS2 2175' applications/defaults.h
          grep -F '#define SPEEDS3 2350' applications/defaults.h
          grep -F '#define SPEEDS4 2525' applications/defaults.h
          grep -F '#define SPEEDS5 2950' applications/defaults.h
          grep -F '#define SPEEDS6 3250' applications/defaults.h
          grep -F '#define SPEEDS7 3975' applications/defaults.h
          grep -F '#define SPEEDS8 4150' applications/defaults.h
          grep -F '#define SPEEDS9 4700' applications/defaults.h

          grep -F '#define LIMITS1 1.75' applications/defaults.h
          grep -F '#define LIMITS2 2.00' applications/defaults.h
          grep -F '#define LIMITS3 2.40' applications/defaults.h
          grep -F '#define LIMITS4 3.00' applications/defaults.h
          grep -F '#define LIMITS5 4.50' applications/defaults.h
          grep -F '#define LIMITS6 6.00' applications/defaults.h
          grep -F '#define LIMITS7 9.20' applications/defaults.h
          grep -F '#define LIMITS8 12.50' applications/defaults.h
          grep -F '#define LIMITS9 20.00' applications/defaults.h

          # Explicitly confirm original running shift logic was not modified.
          git diff -- applications/trigger.c | grep -F 'case SWST_OFF:'
          ! git diff -- applications/trigger.c | grep -F 'SWST_GOING_OFF'
          ! git diff -- applications/trigger.c | grep -F 'SPEED_UP'
          ! git diff -- applications/trigger.c | grep -F 'SPEED_DOWN'
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "applications/app_version.h applications/defaults.h applications/trigger.c "

      - name: Compile HW60 firmware
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchains/gcc-arm-none-eabi-7-2018-q2-update/bin:$PATH"
          cd BT_VESC
          make clean
          make -j2
          cp build/BLDC_4_BT_VESC.bin ../BT_VESC_2.3_GEORGE0.4_SINGLE_PRESS_PRESET_HW60.bin
          cd ..
          sha256sum BT_VESC_2.3_GEORGE0.4_SINGLE_PRESS_PRESET_HW60.bin
          stat -c '%n %s bytes' BT_VESC_2.3_GEORGE0.4_SINGLE_PRESS_PRESET_HW60.bin
          strings BT_VESC_2.3_GEORGE0.4_SINGLE_PRESS_PRESET_HW60.bin | grep -F 'BT_VESC VERSION 2.3 GEORGE 0.4 SINGLE PRESET'

      - name: Create build notes
        shell: bash
        run: |
          cat > BT_VESC_GEORGE04_SINGLE_PRESS_PRESET_BUILD_NOTES.txt <<'EOF'
          BT_VESC 2.3 GEORGE 0.4 - SINGLE PRESS + USER PRESET DEFAULTS - HW60

          Base:
          bwoodill/BT_VESC branch v2.3_GEORGE_0.4
          Official base binary SHA-256:
          26af733e32659ce15542ba67d8a0a3cc78dd008ecab4933fea6541390e247958

          Validation:
          The untouched source was compiled with GCC 7.3.1 and reproduced the
          official GEORGE 0.4 binary byte-for-byte before modifications.

          Behavior change:
          Only SWST_OFF startup behavior is changed: first trigger press sends
          SPEED_ON and enters SWST_ONE_ON. The original GEORGE running click/shift
          state machine is otherwise unchanged.

          Compiled reset defaults:
          d=2 M=9 U=0 T=800 t=900 r=1500 m=5000
          G=6.00 g=0.50 h=0.30 j=900 k=1500 c=50 F=5 a=0.2000
          b=6 R=0 p=10000 f=3000 D=6000 n=3500
          i=2.00 x=14.00 l=00 C=1 J=0 K=6 e=1 E=0
          S1..S9 = 1975,2175,2350,2525,2950,3250,3975,4150,4700
          L1..L9 = 1.75,2.00,2.40,3.00,4.50,6.00,9.20,12.50,20.00
          B1..B3 = 34.00,36.00,38.00

          These are defaults used if BT_VESC initializes/resets its settings block.
          Existing persistent settings may survive a flash; verify with $$ after flash.
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bt-vesc-single-press-preset
          path: |
            BT_VESC_2.3_GEORGE0.4_SINGLE_PRESS_PRESET_HW60.bin
            BT_VESC_GEORGE04_SINGLE_PRESS_PRESET_SOURCE.diff
            BT_VESC_GEORGE04_SINGLE_PRESS_PRESET_BUILD_NOTES.txt
          if-no-files-found: error
