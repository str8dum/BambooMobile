name: BT VESC baseline validation

on:
  push:
    branches:
      - bt-vesc-george-opt-build

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out GEORGE 0.4 source branch
        uses: actions/checkout@v4
        with:
          repository: bwoodill/BT_VESC
          ref: v2.3_GEORGE_0.4
          path: BT_VESC

      - name: Download official GEORGE 0.4 release binary
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --retry 3 -o /tmp/v2.3_george_0.4.zip \
            https://github.com/bwoodill/BT_VESC/releases/download/v2.3/v2.3_george_0.4.zip
          mkdir -p /tmp/george
          unzip -q /tmp/v2.3_george_0.4.zip -d /tmp/george
          sha256sum /tmp/george/BLDC_4_BT_VESC.bin
          stat -c '%n %s bytes' /tmp/george/BLDC_4_BT_VESC.bin
          strings /tmp/george/BLDC_4_BT_VESC.bin | grep -E 'BT_VESC VERSION|GEORGE'

      - name: Install exact ARM GCC 7-2018-q2
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://developer.arm.com/-/media/Files/downloads/gnu-rm/7-2018q2/gcc-arm-none-eabi-7-2018-q2-update-linux.tar.bz2'
          curl -L --retry 3 -o /tmp/gcc-arm-none-eabi.tar.bz2 "$URL"
          echo 'bb17109f0ee697254a5d4ae6e5e01440e3ea8f0277f2e8169bf95d07c7d5fe69  /tmp/gcc-arm-none-eabi.tar.bz2' | sha256sum -c -
          mkdir -p "$HOME/toolchains"
          tar -xjf /tmp/gcc-arm-none-eabi.tar.bz2 -C "$HOME/toolchains"
          echo "$HOME/toolchains/gcc-arm-none-eabi-7-2018-q2-update/bin" >> "$GITHUB_PATH"
          "$HOME/toolchains/gcc-arm-none-eabi-7-2018-q2-update/bin/arm-none-eabi-gcc" --version

      - name: Build untouched GEORGE 0.4 baseline
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$HOME/toolchains/gcc-arm-none-eabi-7-2018-q2-update/bin:$PATH"
          cd BT_VESC
          make clean || true
          make -j2
          cp build/BLDC_4_BT_VESC.bin ../GEORGE04_SOURCE_BUILD.bin
          cd ..
          echo '=== source build ==='
          sha256sum GEORGE04_SOURCE_BUILD.bin
          stat -c '%n %s bytes' GEORGE04_SOURCE_BUILD.bin
          strings GEORGE04_SOURCE_BUILD.bin | grep -E 'BT_VESC VERSION|GEORGE'
          echo '=== compare to official release ==='
          cmp -l GEORGE04_SOURCE_BUILD.bin /tmp/george/BLDC_4_BT_VESC.bin | head -20 || true
          if cmp -s GEORGE04_SOURCE_BUILD.bin /tmp/george/BLDC_4_BT_VESC.bin; then
            echo 'EXACT_MATCH=YES'
          else
            echo 'EXACT_MATCH=NO'
          fi

      - name: Upload baseline build
        uses: actions/upload-artifact@v4
        with:
          name: bt-vesc-george04-baseline
          path: GEORGE04_SOURCE_BUILD.bin
          if-no-files-found: error
