name: X2D Android Lint Diagnose

on:
  push:
    branches: [x2d-status]
    paths:
      - '.github/workflows/x2d-android-lint-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Apply exact production patches
        run: |
          python3 scripts/apply_x2d_rc.py
          python3 scripts/apply_x2d_rc2.py
          python3 scripts/apply_x2d_audit_fixes.py
          python3 scripts/apply_x2d_final.py
          python3 scripts/apply_x2d_compile_fix.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Run clean Android lint and unit tests
        id: lint
        shell: bash
        run: |
          set +e
          cd src-tauri/gen/android
          ./gradlew --no-daemon clean :app:lintDebug :app:testDebugUnitTest 2>&1 | tee ../../../../android-lint.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture exact source and reports
        if: always()
        shell: bash
        run: |
          CAM=src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/X2dCameraPlugin.kt
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          {
            echo '=== HEAD ==='
            git rev-parse HEAD
            echo '=== CAMERA SHA256 ==='
            sha256sum "$CAM"
            echo '=== GRADLE SHA256 ==='
            sha256sum "$GRADLE"
            echo '=== SDK/MEDIA3 ==='
            grep -nE 'compileSdk|targetSdk|media3' "$GRADLE" || true
            echo '=== CAMERA CONTEXT ==='
            grep -nE 'PlayerView|TextureView|context|activity' "$CAM" || true
          } > android-source-summary.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x2d-android-lint-diagnostics
          path: |
            android-lint.log
            android-source-summary.txt
            src-tauri/gen/android/app/build/reports/lint-results-debug.txt
            src-tauri/gen/android/app/build/reports/lint-results-debug.html
            src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/X2dCameraPlugin.kt
            src-tauri/gen/android/app/build.gradle.kts
          if-no-files-found: warn

      - name: Fail if lint or tests failed
        if: always()
        shell: bash
        run: test "${{ steps.lint.outputs.exit_code }}" = "0"
