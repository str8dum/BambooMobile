name: X2D Android Lint Diagnose

on:
  push:
    branches: [x2d-status]
    paths:
      - '.github/workflows/x2d-android-lint-diagnose.yml'
      - 'src-tauri/gen/android/app/build.gradle.kts'
      - 'src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/*.kt'
      - 'scripts/apply_x2d_rc2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install Linux / Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Apply exact production patches
        run: |
          python3 scripts/apply_x2d_rc.py
          python3 scripts/apply_x2d_rc2.py
          python3 scripts/apply_x2d_audit_fixes.py
          python3 scripts/apply_x2d_final.py
          python3 scripts/apply_x2d_compile_fix.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK / NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          rustup target add aarch64-linux-android

      - name: Generate Android project and verify compile
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --apk --target aarch64 --ci

      - name: Run clean Android lint and unit tests
        id: lint
        shell: bash
        run: |
          set +e
          cd src-tauri/gen/android

          ./gradlew --no-daemon clean :app:lintArmDebug --stacktrace --warning-mode all 2>&1 | tee ../../../android-lint.log
          lint_code=${PIPESTATUS[0]}

          ./gradlew --no-daemon :app:testArmDebugUnitTest --stacktrace --warning-mode all 2>&1 | tee ../../../android-unit-tests.log
          test_code=${PIPESTATUS[0]}

          echo "lint_exit_code=$lint_code" >> "$GITHUB_OUTPUT"
          echo "test_exit_code=$test_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture exact source and reports
        if: always()
        shell: bash
        run: |
          CAM=src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/X2dCameraPlugin.kt
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          {
            echo '=== HEAD ==='
            git rev-parse HEAD
            echo '=== CAMERA SHA256 ==='
            sha256sum "$CAM"
            echo '=== GRADLE SHA256 ==='
            sha256sum "$GRADLE"
            echo '=== SDK/MEDIA3 ==='
            grep -nE 'compileSdk|targetSdk|media3' "$GRADLE" || true
            echo '=== CAMERA CONTEXT ==='
            grep -nE 'PlayerView|TextureView|context|activity|X509TrustManager|SSLContext' "$CAM" || true
          } > android-source-summary.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x2d-android-lint-diagnostics-${{ github.run_number }}
          path: |
            android-lint.log
            android-unit-tests.log
            android-source-summary.txt
            src-tauri/gen/android/app/build/reports/
            src-tauri/gen/android/app/build/test-results/
            src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/X2dCameraPlugin.kt
            src-tauri/gen/android/app/build.gradle.kts
          if-no-files-found: warn

      - name: Fail if lint or tests failed
        if: always()
        shell: bash
        run: |
          test "${{ steps.lint.outputs.lint_exit_code }}" = "0"
          test "${{ steps.lint.outputs.test_exit_code }}" = "0"
