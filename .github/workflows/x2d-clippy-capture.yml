name: X2D Clippy Capture

on:
  push:
    branches: [x2d-status]
    paths:
      - '.github/workflows/x2d-clippy-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: Apply exact RC2 patches
        run: |
          python3 scripts/apply_x2d_rc.py
          python3 scripts/apply_x2d_rc2.py
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Capture strict Clippy output
        shell: bash
        run: |
          set +e
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings 2>&1 | tee clippy.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > clippy-exit.txt
          echo "clippy exit=$rc"
          exit 0
      - name: Upload Clippy report
        uses: actions/upload-artifact@v4
        with:
          name: X2D-Clippy-Report
          path: |
            clippy.txt
            clippy-exit.txt
          if-no-files-found: error
