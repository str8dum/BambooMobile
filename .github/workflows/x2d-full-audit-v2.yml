name: X2D Full Audit V2

on:
  push:
    branches: [x2d-status]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare stable signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 -d .github/x2d-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA256:|Alias name:'
      - name: Apply production X2D patch stack
        run: |
          python3 scripts/apply_x2d_rc.py
          python3 scripts/apply_x2d_rc2.py
          python3 scripts/apply_x2d_audit_fixes.py
          python3 scripts/apply_x2d_final.py
          python3 scripts/apply_x2d_compile_fix.py
          python3 scripts/apply_x2d_camera_zoom.py
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Force monotonically increasing Android versionCode
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((100000 + $(git rev-list --count HEAD)))
          GRADLE=src-tauri/gen/android/app/build.gradle.kts
          python3 - "$GRADLE" "$VERSION_CODE" <<'PY'
          import re, sys
          from pathlib import Path
          p=Path(sys.argv[1]); v=sys.argv[2]; s=p.read_text()
          n=re.subn(r'versionCode\s*=\s*\d+', f'versionCode = {v}', s, count=1)
          if n[1] != 1: raise SystemExit('Could not patch Android versionCode')
          p.write_text(n[0])
          print('versionCode =', v)
          PY
          echo "BAMBOO_X2D_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Build audited ARM64 APK
        shell: bash
        run: |
          set -euo pipefail
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --apk --target aarch64 --ci
      - name: Verify stable signing and version
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          KEY_CERT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test -n "$APK_CERT" && test "$APK_CERT" = "$KEY_CERT"
          BADGING=$($AAPT dump badging "$APK" | head -1)
          echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='$BAMBOO_X2D_VERSION_CODE'"
      - uses: actions/upload-artifact@v4
        with:
          name: BambooMobile-X2D-Audited
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
