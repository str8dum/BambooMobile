name: X2D Full Audit V2

on:
  push:
    branches: [x2d-status]
    paths:
      - '.github/workflows/x2d-full-audit-v2.yml'
      - 'scripts/apply_x2d_rc.py'
      - 'scripts/apply_x2d_rc2.py'
      - 'scripts/apply_x2d_audit_fixes.py'
      - 'scripts/apply_x2d_final.py'
      - 'scripts/apply_x2d_compile_fix.py'
      - 'src-tauri/gen/android/app/build.gradle.kts'
      - 'src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/*.kt'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out clean branch
        uses: actions/checkout@v4

      - name: Install Linux / Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Apply exact production patches
        run: |
          python3 scripts/apply_x2d_rc.py
          python3 scripts/apply_x2d_rc2.py
          python3 scripts/apply_x2d_audit_fixes.py
          python3 scripts/apply_x2d_final.py
          python3 scripts/apply_x2d_compile_fix.py

      - name: Verify critical invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          lib=Path('src-tauri/src/lib.rs').read_text()
          caps=json.loads(Path('src-tauri/capabilities/default.json').read_text())
          build=Path('src-tauri/build.rs').read_text()
          svc=Path('src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/PrinterForegroundService.kt').read_text()
          cam=Path('src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/X2dCameraPlugin.kt').read_text()
          card=Path('src/components/PrintStatusCard.tsx').read_text()
          checks={
            'camera ACL declaration': '"x2dCamera"' in build,
            'camera capability grant': 'x2dCamera:default' in caps['permissions'],
            'RTSPS 322 camera': ':322/streaming/live/1' in cam and 'setForceUseRtpTcp(true)' in cam,
            'dual nozzle packed decode': '(packed & 0xFFFF)' in lib and '((packed >> 16) & 0xFFFF)' in lib,
            'MQTT packet limit': 'set_max_packet_size(256 * 1024, 256 * 1024)' in lib,
            'pushall QoS0': '.publish(&req_topic, QoS::AtMostOnce, false, pushall.clone())' in lib,
            'get_version QoS1': '.publish(&req_topic, QoS::AtLeastOnce, false, get_version.clone())' in lib,
            'skip_objects MQTT command': '"command": "skip_objects"' in lib and '"obj_list": object_ids' in lib,
            'skip acknowledgement parser': 'p.get("s_obj")' in lib and 'skipped_objects' in lib,
            'skip UI layer-boundary notice': 'finish the current layer' in card and 'Skip Failed Object' in card,
            'FTP newline guard': "cmd.contains('\\r') || cmd.contains('\\n')" in lib,
            'streaming file downloads': 'std::io::copy(&mut data, &mut out)' in lib,
            'preview cache sanitized': 'let cache_key: String = subtask_name' in lib,
            'AMS firmware temperature selection': '"curr_temp":   -1' in lib and '"tar_temp":    -1' in lib,
            'SSDP child abort guards': '_listener_guards' in lib,
            'standalone credentials retained': 'clearStoredCredentials()\n                                    stopSelf()' not in svc,
            'unload tray context retained once': lib.count('let curr_tray = status.tray_now;') == 1,
          }
          failed=[]
          for name,ok in checks.items():
            print(f'{name}: {"PASS" if ok else "FAIL"}')
            if not ok: failed.append(name)
          if failed: raise SystemExit('failed invariants: '+', '.join(failed))
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Resolve patched runtime dependencies
        shell: bash
        run: |
          cd src-tauri
          cargo update -p h2@0.4.14 --precise 0.4.16
          cargo update -p quinn-proto@0.11.14 --precise 0.11.15
          cargo update -p rustls@0.23.40 --precise 0.23.45
          echo 'Resolved security-sensitive versions:'
          cargo tree -i h2@0.4.16 || true
          cargo tree -i quinn-proto@0.11.15 --target all || true
          cargo tree -i rustls@0.23.45 || true

      - name: Format Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Run all Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Strict Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Cargo dependency audit
        shell: bash
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 | tee cargo-audit.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JS dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: TypeScript and production frontend build
        run: pnpm build

      - name: Production JS dependency audit
        shell: bash
        run: pnpm audit --prod --audit-level high | tee pnpm-audit.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK / NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
          rustup target add aarch64-linux-android

      - name: Generate Android project and verify compile
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --apk --target aarch64 --ci

      - name: Android clean lint and unit tests
        shell: bash
        run: |
          cd src-tauri/gen/android
          ./gradlew --no-daemon clean :app:lintDebug :app:testDebugUnitTest

      - name: Rebuild final ARM64 Android APK
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --apk --target aarch64 --ci

      - name: APK integrity and manifest inspection
        shell: bash
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$APK"
          unzip -t "$APK" | tee apk-zip-test.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Snapshot exact audited source
        shell: bash
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='target' --exclude='src-tauri/target' --exclude='src-tauri/gen/android/app/build' -czf x2d-audited-source.tar.gz package.json pnpm-lock.yaml tsconfig.json vite.config.ts src src-tauri scripts

      - name: Upload audited APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: BambooMobile-X2D-RC3-Audited
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            cargo-audit.txt
            pnpm-audit.txt
            apk-zip-test.txt
            apk-badging.txt
            apk-sha256.txt
            x2d-audited-source.tar.gz
            src-tauri/gen/android/app/build/reports/lint-results-debug.html
            src-tauri/gen/android/app/build/reports/lint-results-debug.txt
          if-no-files-found: error
