name: X2D Full Post-Patch Audit

on:
  push:
    branches: [x2d-status]
    paths:
      - '.github/workflows/x2d-full-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v4

      - name: Install Linux / Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Apply exact RC2 build patches
        run: |
          python3 scripts/apply_x2d_rc.py
          python3 scripts/apply_x2d_rc2.py

      - name: Static architecture and security audit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          findings=[]
          def check(name, ok, severity='ERROR', detail=''):
              print(f'{name}: {"PASS" if ok else severity}')
              if not ok:
                  findings.append((severity,name,detail))

          lib=Path('src-tauri/src/lib.rs').read_text()
          caps=json.loads(Path('src-tauri/capabilities/default.json').read_text())
          tauri=json.loads(Path('src-tauri/tauri.conf.json').read_text())
          manifest=Path('src-tauri/gen/android/app/src/main/AndroidManifest.xml').read_text()
          camera=Path('src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/X2dCameraPlugin.kt').read_text()
          svc=Path('src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/PrinterForegroundService.kt').read_text()
          dash=Path('src/pages/Dashboard.tsx').read_text()
          types=Path('src/vite-env.d.ts').read_text()
          pkg=json.loads(Path('package.json').read_text())

          perms=caps.get('permissions',[])
          check('Camera plugin registered in Rust', 'new("x2dCamera")' in lib)
          check('Camera frontend permission granted', 'x2dCamera:default' in perms,
                detail='Tauri v2 frontend plugin commands require a capability permission.')
          check('Notification plugin permission granted', 'printNotification:default' in perms)
          check('Camera plugin non-exported by Android component model', 'X2dCameraPlugin' not in manifest)
          check('Foreground service is not exported', 'android:name=".PrinterForegroundService"' in manifest and 'android:exported="false"' in manifest)
          check('FileProvider is not exported', 'android:name="androidx.core.content.FileProvider"' in manifest and 'android:exported="false"' in manifest)
          check('RC MQTT packet size raised', 'set_max_packet_size(256 * 1024, 256 * 1024)' in lib)
          check('MQTT serial normalized', 'serial.trim().to_uppercase()' in lib)
          check('MQTT clean session explicit', 'set_clean_session(true)' in lib)
          check('Pushall QoS0', '.publish(&req_topic, QoS::AtMostOnce, false, pushall.clone())' in lib)
          check('get_version QoS1', '.publish(&req_topic, QoS::AtLeastOnce, false, get_version.clone())' in lib)
          check('Non-status MQTT packets do not emit zero status', 'if !parse_status(&msg.payload, &mut st)' in lib)
          check('Dual nozzle fields exposed', all(x in types for x in ['left_nozzle_temp','right_nozzle_temp','active_nozzle','dual_nozzle']))
          check('Packed extruder temperatures decoded', '(packed & 0xFFFF)' in lib and '((packed >> 16) & 0xFFFF)' in lib)
          check('X2D camera uses RTSPS port 322', ':322/streaming/live/1' in camera)
          check('Camera RTP forced over TCP', 'setForceUseRtpTcp(true)' in camera)
          check('Camera access code not logged', not re.search(r'Log\.[a-zA-Z]+\([^\n]*(accessCode|encodedCode|url)', camera))
          check('Dashboard hides native camera with sidebar', 'cameraVisible={!sidebarOpen}' in Path('src/App.tsx').read_text())
          check('ETA no artificial minus sign', '`-${h}h' not in Path('src/utils/printer.ts').read_text())
          check('CSP configured', tauri.get('app',{}).get('security',{}).get('csp') is not None,
                severity='WARN', detail='CSP is null; an XSS would have broader impact in a Tauri app.')
          check('Standalone MQTT credentials not cleared on normal print finish',
                'clearStoredCredentials()\n                                        stopSelf()' not in svc,
                severity='WARN', detail='Clearing saved credentials after a finished/idle recovery breaks a later standalone restart until the app reconnects.')
          check('No hardcoded Bambu access code literal', not re.search(r'(?i)(access[_ ]?code|password)\s*[=:]\s*["\'][0-9a-f]{8}["\']', '\n'.join([lib,camera,svc,dash])))
          check('Frontend production build script includes typecheck', pkg.get('scripts',{}).get('build','').startswith('tsc'))

          print('\nFINDINGS')
          for severity,name,detail in findings:
              print(f'{severity}: {name}: {detail}')
          Path('audit-findings.txt').write_text('\n'.join(f'{s}: {n}: {d}' for s,n,d in findings)+'\n')
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Format post-patch Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Run all Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Cargo dependency advisory audit
        shell: bash
        run: |
          cargo install cargo-audit --locked
          cargo audit --file src-tauri/Cargo.lock | tee cargo-audit.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JS dependencies exactly from lockfile
        run: pnpm install --frozen-lockfile

      - name: TypeScript and Vite production build
        run: pnpm build

      - name: NPM dependency advisory audit
        shell: bash
        run: pnpm audit --prod --audit-level high | tee pnpm-audit.txt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Add Android ARM64 Rust target
        run: rustup target add aarch64-linux-android

      - name: Full ARM64 Android build
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --apk --target aarch64 --ci

      - name: Android lint and unit tests
        shell: bash
        run: |
          cd src-tauri/gen/android
          ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest

      - name: Inspect built manifest / APK
        shell: bash
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "APK=$APK"
          test -n "$APK"
          unzip -t "$APK" > apk-zip-test.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" > apk-badging.txt
          cat apk-badging.txt | head -n 20

      - name: Build post-patch source snapshot
        shell: bash
        run: |
          tar --exclude='.git' --exclude='node_modules' --exclude='target' --exclude='src-tauri/target' --exclude='src-tauri/gen/android/app/build' -czf x2d-rc2-postpatch-source.tar.gz \
            package.json pnpm-lock.yaml tsconfig.json vite.config.ts src src-tauri scripts .github/workflows

      - name: Upload full audit reports and source
        uses: actions/upload-artifact@v4
        with:
          name: BambooMobile-X2D-Full-Audit
          path: |
            audit-findings.txt
            cargo-audit.txt
            pnpm-audit.txt
            apk-zip-test.txt
            apk-badging.txt
            x2d-rc2-postpatch-source.tar.gz
            src-tauri/gen/android/app/build/reports/lint-results-debug.html
            src-tauri/gen/android/app/build/reports/lint-results-debug.txt
          if-no-files-found: warn
