name: X2D RC2 Verify and Build

on:
  push:
    branches: [x2d-status]
    paths:
      - '.github/workflows/x2d-rc.yml'
      - 'scripts/apply_x2d_rc.py'
      - 'scripts/apply_x2d_rc2.py'
      - 'src/components/DualNozzleGauge.tsx'
      - 'src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/X2dCameraPlugin.kt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux Tauri test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Apply consolidated X2D status patch
        run: python3 scripts/apply_x2d_rc.py

      - name: Apply X2D camera and dual-nozzle patch
        run: python3 scripts/apply_x2d_rc2.py

      - name: Audit patched source invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src-tauri/src/lib.rs').read_text()
          g = Path('src-tauri/gen/android/app/build.gradle.kts').read_text()
          d = Path('src/pages/Dashboard.tsx').read_text()
          c = Path('src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/X2dCameraPlugin.kt').read_text()
          u = Path('src/utils/printer.ts').read_text()
          checks = {
              '256KiB MQTT limit': 'set_max_packet_size(256 * 1024, 256 * 1024)' in s,
              'clean session explicit': 'set_clean_session(true)' in s,
              'push_target': '"push_target": 1' in s,
              'pushall QoS0': '.publish(&req_topic, QoS::AtMostOnce, false, pushall.clone())' in s,
              'get_version QoS1': '.publish(&req_topic, QoS::AtLeastOnce, false, get_version.clone())' in s,
              'MQTT errors visible': '"_mqtt_error"' in s,
              'serial normalized': 'serial.trim().to_uppercase()' in s,
              'dual nozzle status fields': 'left_nozzle_temp' in s and 'right_nozzle_temp' in s,
              'packed extruder decode': '(packed & 0xFFFF)' in s and '((packed >> 16) & 0xFFFF)' in s,
              'active nozzle decode': '((state >> 4) & 0x0F)' in s,
              'camera plugin registered': '"x2dCamera"' in s and '"X2dCameraPlugin"' in s,
              'Media3 RTSP dependency': 'media3-exoplayer-rtsp:1.11.0' in g,
              'RTSPS port 322': ':322/streaming/live/1' in c,
              'RTP over TCP': 'setForceUseRtpTcp(true)' in c,
              'trust-all TLS socket factory': 'sslContext.socketFactory' in c,
              'dashboard native camera bridge': "plugin:x2dCamera|show_camera" in d,
              'dashboard dual nozzle cards': 'DualNozzleGauge' in d,
              'ETA minus removed': 'return h > 0 ? `${h}h${m}m` : `${m}m`;' in u,
          }
          for name, ok in checks.items():
              print(f'{name}: {"PASS" if ok else "FAIL"}')
              assert ok, name
          PY

      - name: Audit real X2D payload schema
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://raw.githubusercontent.com/greghesp/ha-bambulab/main/custom_components/bambu_lab/pybambu/mock_data/MOCK-X2D.json'
          with urllib.request.urlopen(url, timeout=20) as r:
              data=json.loads(r.read())
          p=data['pushall']['print']
          compact=json.dumps(data['pushall'], separators=(',', ':')).encode()
          ext=p['device']['extruder']
          decoded={}
          for e in ext['info']:
              if e.get('id') in (0,1) and 'temp' in e:
                  packed=int(e['temp'])
                  decoded[e['id']]={'current': packed & 0xffff, 'target': (packed >> 16) & 0xffff}
          active=(int(ext['state']) >> 4) & 0xf
          print('reference_x2d_compact_bytes=', len(compact))
          print('decoded_nozzles=', decoded)
          print('active_nozzle=', active)
          print('ipcam_rtsp_url=', p.get('ipcam',{}).get('rtsp_url'))
          assert len(compact) < 256*1024
          assert 0 in decoded and 1 in decoded
          assert active in (0,1)
          assert 'rtsp_url' in p.get('ipcam', {})
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run all X2D Rust parser tests
        run: cargo test --manifest-path src-tauri/Cargo.toml x2d --lib

      - name: Format patched Rust
        run: cargo fmt --manifest-path src-tauri/Cargo.toml

      - name: Check Rust after formatting
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install

      - name: Build web frontend
        run: pnpm build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Add Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Build ARM64 Android APK
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --apk --target aarch64 --ci

      - name: Upload verified RC2 APK
        uses: actions/upload-artifact@v4
        with:
          name: BambooMobile-X2D-RC2
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
