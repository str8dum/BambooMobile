name: X2D RC Verify and Build

on:
  push:
    branches: [x2d-status]
    paths:
      - '.github/workflows/x2d-rc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Apply consolidated X2D compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lib = Path('src-tauri/src/lib.rs')
          s = lib.read_text()

          # 1) Normalize all connection inputs in the backend so UI whitespace/case
          # can never create a bad MQTT topic or password.
          marker = '''    if conn.is_some() {
              return Err("Already connected".into());
          }

          // MQTT with TLS'''
          replacement = '''    if conn.is_some() {
              return Err("Already connected".into());
          }

          let ip = ip.trim().to_string();
          let access_code = access_code.trim().to_string();
          let serial = serial.trim().to_uppercase();
          if ip.is_empty() || access_code.is_empty() || serial.is_empty() {
              return Err("Printer IP, access code and serial are required".into());
          }

          // MQTT with TLS'''
          if marker not in s:
              raise SystemExit('connect input marker not found')
          s = s.replace(marker, replacement, 1)

          # 2) Use a fresh short client id and explicitly allow modern X2D-sized
          # status frames. rumqttc 0.24 defaults incoming packets to 10 KiB.
          marker = '''    let mut opts = MqttOptions::new("bamboo-mobile", &ip, 8883);
          opts.set_credentials("bblp", &access_code);
          opts.set_keep_alive(std::time::Duration::from_secs(10));'''
          replacement = '''    let client_id = format!(
              "bm-{}",
              std::time::SystemTime::now()
                  .duration_since(std::time::UNIX_EPOCH)
                  .unwrap_or_default()
                  .as_millis() % 10_000_000_000u128
          );
          let mut opts = MqttOptions::new(client_id, &ip, 8883);
          opts.set_credentials("bblp", &access_code);
          opts.set_keep_alive(std::time::Duration::from_secs(10));
          opts.set_clean_session(true);
          opts.set_max_packet_size(256 * 1024, 256 * 1024);'''
          if marker not in s:
              raise SystemExit('MqttOptions marker not found')
          s = s.replace(marker, replacement, 1)

          # 3) Mirror current Studio pushall wire format. Studio/Orca publishes
          # pushall at QoS 0, while get_version is QoS 1.
          old = '''        let pushall = serde_json::json!({
              "pushing": {"sequence_id": "0", "command": "pushall", "version": 1}
          })
          .to_string();
          let get_version = serde_json::json!({
              "info": {"sequence_id": "0", "command": "get_version"}
          })'''
          new = '''        let pushall = serde_json::json!({
              "pushing": {
                  "sequence_id": "20000",
                  "command": "pushall",
                  "version": 1,
                  "push_target": 1
              }
          })
          .to_string();
          let get_version = serde_json::json!({
              "info": {"sequence_id": "20001", "command": "get_version"}
          })'''
          if old not in s:
              raise SystemExit('pushall/get_version marker not found')
          s = s.replace(old, new, 1)

          # Keep pushall QoS 0, set get_version QoS 1.
          old = '.publish(&req_topic, QoS::AtMostOnce, false, get_version.clone())'
          if old not in s:
              raise SystemExit('get_version publish marker not found')
          s = s.replace(old, '.publish(&req_topic, QoS::AtLeastOnce, false, get_version.clone())', 1)

          # 4) parse_status reports whether a message actually contained a print
          # object. This prevents info/get_version from emitting fake all-zero status.
          old = '''fn parse_status(payload: &[u8], status: &mut PrinterStatus) {
              let Ok(v) = serde_json::from_slice::<serde_json::Value>(payload) else {
                  return;
              };

              // device_name is set via SSDP discovery (DevName.bambu.com), not MQTT.

              let Some(p) = v.get("print") else { return };'''
          new = '''fn parse_status(payload: &[u8], status: &mut PrinterStatus) -> bool {
              let Ok(v) = serde_json::from_slice::<serde_json::Value>(payload) else {
                  return false;
              };

              // device_name is set via SSDP discovery (DevName.bambu.com), not MQTT.

              let Some(p) = v.get("print") else { return false };'''
          if old not in s:
              raise SystemExit('parse_status header marker not found')
          s = s.replace(old, new, 1)

          old = '''            .unwrap_or_default();
              }
          }

          fn stage_name'''
          new = '''            .unwrap_or_default();
              }

              true
          }

          fn stage_name'''
          if old not in s:
              raise SystemExit('parse_status end marker not found')
          s = s.replace(old, new, 1)

          old = '                    parse_status(&msg.payload, &mut st);'
          new = '''                    if !parse_status(&msg.payload, &mut st) {
                          continue;
                      }'''
          if old not in s:
              raise SystemExit('parse_status call marker not found')
          s = s.replace(old, new, 1)

          # 5) Never silently swallow MQTT decoder/transport errors again. Route them
          # to the existing raw debug channel so a packet-limit/TLS failure is visible.
          old = '''                Err(_) => {
                      tokio::time::sleep(std::time::Duration::from_secs(2)).await;
                  }'''
          new = '''                Err(e) => {
                      let _ = app_c.emit(
                          "mqtt-raw",
                          serde_json::json!({"_mqtt_error": e.to_string()}).to_string(),
                      );
                      tokio::time::sleep(std::time::Duration::from_secs(2)).await;
                  }'''
          if old not in s:
              raise SystemExit('eventloop error marker not found')
          s = s.replace(old, new, 1)

          # Add parser regression tests using the compatibility fields confirmed in
          # real X2D push_status captures, plus nested X2D-only structures.
          test = r'''

          #[cfg(test)]
          mod x2d_compat_tests {
              use super::*;

              #[test]
              fn x2d_compat_parse_status_fields() {
                  let payload = serde_json::json!({
                      "print": {
                          "command": "push_status",
                          "nozzle_temper": 250.0,
                          "nozzle_target_temper": "255.0",
                          "bed_temper": 70.0,
                          "bed_target_temper": "72.0",
                          "mc_percent": 98,
                          "mc_remaining_time": "2",
                          "layer_num": 129,
                          "total_layer_num": "140",
                          "spd_lvl": 2,
                          "gcode_state": "RUNNING",
                          "subtask_name": "X2D parser test",
                          "task_id": "123",
                          "stg_cur": 17,
                          "device": {
                              "extruder": {"info": [{"id": 0}, {"id": 1}]},
                              "nozzle": {"exist": 3, "info": [{"id": 0}, {"id": 1}]}
                          },
                          "3D": {"layer_num": 129, "total_layer_num": 140}
                      }
                  });
                  let bytes = serde_json::to_vec(&payload).unwrap();
                  let mut st = PrinterStatus::default();
                  assert!(parse_status(&bytes, &mut st));
                  assert_eq!(st.nozzle_temp, 250.0);
                  assert_eq!(st.nozzle_target, 255.0);
                  assert_eq!(st.bed_temp, 70.0);
                  assert_eq!(st.bed_target, 72.0);
                  assert_eq!(st.progress, 98);
                  assert_eq!(st.remaining_mins, 2);
                  assert_eq!(st.layer_num, 129);
                  assert_eq!(st.total_layer_num, 140);
                  assert_eq!(st.gcode_state, "RUNNING");
              }

              #[test]
              fn x2d_info_message_is_not_status() {
                  let bytes = br#"{"info":{"command":"get_version","sequence_id":"0"}}"#;
                  let mut st = PrinterStatus::default();
                  assert!(!parse_status(bytes, &mut st));
                  assert_eq!(st.nozzle_temp, 0.0);
              }
          }
          '''
          s += test
          lib.write_text(s)

          # 6) Keep the Android standalone fallback on the same current pushall
          # format. Paho already sends it at QoS 0 with a unique client id.
          svc = Path('src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/PrinterForegroundService.kt')
          k = svc.read_text()
          old = '\"\"\"{\\"pushing\\":{\\"sequence_id\\":\\"0\\",\\"command\\":\\"pushall\\",\\"version\\":1}}\"\"\"'
          new = '\"\"\"{\\"pushing\\":{\\"sequence_id\\":\\"20000\\",\\"command\\":\\"pushall\\",\\"version\\":1,\\"push_target\\":1}}\"\"\"'
          if old not in k:
              raise SystemExit('Kotlin pushall marker not found')
          svc.write_text(k.replace(old, new, 1))

          # 7) Make the manual debug Pushall button send the same payload and label
          # this build clearly.
          dbg = Path('src/pages/DebugPage.tsx')
          d = dbg.read_text()
          d = re.sub(r'MQTT Debug — X2D\.\d+', 'MQTT Debug — X2D RC1', d)
          d = re.sub(
              r"sendRequest\(\{ pushing: \{ sequence_id: '.*?', command: 'pushall'.*?\} \}\)",
              "sendRequest({ pushing: { sequence_id: '20000', command: 'pushall', version: 1, push_target: 1 } })",
              d,
              count=1,
          )
          dbg.write_text(d)

          print('Consolidated X2D RC patch applied')
          PY

      - name: Audit patched source invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('src-tauri/src/lib.rs').read_text()
          checks = {
              '256KiB MQTT limit': 'set_max_packet_size(256 * 1024, 256 * 1024)' in s,
              'clean session explicit': 'set_clean_session(true)' in s,
              'push_target': '"push_target": 1' in s,
              'pushall QoS0': '.publish(&req_topic, QoS::AtMostOnce, false, pushall.clone())' in s,
              'get_version QoS1': '.publish(&req_topic, QoS::AtLeastOnce, false, get_version.clone())' in s,
              'MQTT errors visible': '"_mqtt_error"' in s,
              'serial normalized': 'serial.trim().to_uppercase()' in s,
          }
          for name, ok in checks.items():
              print(f'{name}: {"PASS" if ok else "FAIL"}')
              assert ok, name
          PY

      - name: Measure reference X2D payload
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request
          url='https://raw.githubusercontent.com/greghesp/ha-bambulab/main/custom_components/bambu_lab/pybambu/mock_data/MOCK-X2D.json'
          with urllib.request.urlopen(url, timeout=20) as r:
              data=json.loads(r.read())
          b=json.dumps(data['pushall'], separators=(',', ':')).encode()
          print('reference_x2d_compact_bytes=', len(b))
          print('rc_incoming_limit=', 256*1024)
          assert len(b) < 256*1024
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run X2D Rust parser tests
        run: cargo test --manifest-path src-tauri/Cargo.toml x2d_compat --lib

      - name: Format check patched Rust
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install

      - name: Build web frontend
        run: pnpm build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Add Android Rust target
        run: rustup target add aarch64-linux-android

      - name: Build ARM64 Android APK
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --apk --target aarch64 --ci

      - name: Upload verified RC APK
        uses: actions/upload-artifact@v4
        with:
          name: BambooMobile-X2D-RC1
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
