name: X2D Test APK

on:
  push:
    branches:
      - x2d-status
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out X2D branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare stable signing and version
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          base64 -d .github/x2d-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          VERSION_CODE=$((100000 + $(git rev-list --count HEAD)))
          echo "BAMBOO_X2D_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Stable X2D signing key installed; versionCode=$VERSION_CODE"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Apply exact production X2D patches
        shell: bash
        run: |
          python3 scripts/apply_x2d_rc.py
          python3 scripts/apply_x2d_rc2.py
          python3 scripts/apply_x2d_audit_fixes.py
          python3 scripts/apply_x2d_final.py
          python3 scripts/apply_x2d_compile_fix.py

      - name: Verify X2D camera and temperature invariants
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lib = Path('src-tauri/src/lib.rs').read_text()
          cam = Path('src-tauri/gen/android/app/src/main/java/com/joelsgc/bamboomobile/X2dCameraPlugin.kt').read_text()
          dash = Path('src/pages/Dashboard.tsx').read_text()
          required = {
              'camera port 322': ':322/streaming/live/1' in cam and 'RtspSurfaceView' in cam,
              'dual nozzle decode': '(packed & 0xFFFF)' in lib and '((packed >> 16) & 0xFFFF)' in lib,
              'dual nozzle UI': 'DualNozzleGauge' in dash,
              'X2D camera UI': 'X2D secure H.264 stream · port 322' in dash,
              'X2D chooses 322 UI': "status?.dual_nozzle ?" in dash and "'X2D secure H.264 stream · port 322'" in dash,
          }
          failed = [name for name, ok in required.items() if not ok]
          for name, ok in required.items():
              print(f'{name}: {"PASS" if ok else "FAIL"}')
          if failed:
              raise SystemExit('failed invariants: ' + ', '.join(failed))
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ARM64 debug APK
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --apk --target aarch64 --ci

      - name: Show generated APKs
        if: always()
        run: find src-tauri/gen/android/app/build/outputs -type f -name "*.apk" -print || true

      - name: Upload X2D APK
        uses: actions/upload-artifact@v4
        with:
          name: BambooMobile-X2D-Production-Test
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
