name: X2D Test APK
on:
  push:
    branches: [x2d-status]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Prepare persistent signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          base64 -d .github/x2d-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "BAMBOO_X2D_VERSION_CODE=$((100000 + $(git rev-list --count HEAD)))" >> "$GITHUB_ENV"
      - name: Apply production X2D patches
        run: |
          python3 scripts/apply_x2d_rc.py
          python3 scripts/apply_x2d_rc2.py
          python3 scripts/apply_x2d_audit_fixes.py
          python3 scripts/apply_x2d_final.py
          python3 scripts/apply_x2d_compile_fix.py
          python3 scripts/apply_x2d_camera_zoom.py
          python3 scripts/apply_scd_x2d_branding.py
      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: temurin }
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - uses: pnpm/action-setup@v4
        with: { version: latest }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: pnpm }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: pnpm install --frozen-lockfile
      - name: Set Android versionCode
        run: python3 scripts/apply_x2d_version_code.py
      - name: Build ARM64 debug APK
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --apk --target aarch64 --ci
      - name: Verify update compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -1)
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          APK_CERT=$($APKSIGNER verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')
          KEY_CERT=$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')
          echo "APK cert=$APK_CERT"; echo "Persistent cert=$KEY_CERT"
          test -n "$APK_CERT" && test "$APK_CERT" = "$KEY_CERT"
          BADGING=$($AAPT dump badging "$APK" | head -1); echo "$BADGING"
          echo "$BADGING" | grep -q "versionCode='$BAMBOO_X2D_VERSION_CODE'"
      - uses: actions/upload-artifact@v4
        with:
          name: SCD-X2D-Production-Test
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
