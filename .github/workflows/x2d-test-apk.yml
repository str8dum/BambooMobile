name: X2D Test APK

on:
  push:
    branches:
      - x2d-status
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out X2D branch
        uses: actions/checkout@v4

      - name: Apply X2D MQTT compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lib = Path("src-tauri/src/lib.rs")
          s = lib.read_text()

          pushall_pattern = re.compile(
              r'let\s+pushall\s*=\s*serde_json::json!\(\{\s*"pushing"\s*:\s*\{\s*"sequence_id"\s*:\s*"0"\s*,\s*"command"\s*:\s*"pushall"\s*,\s*"version"\s*:\s*1\s*\}\s*\}\)\s*\.to_string\(\);',
              re.S,
          )
          new_pushall = '''let pushall = serde_json::json!({
              "pushing": {
                  "sequence_id": "20001",
                  "command": "pushall",
                  "version": 1,
                  "push_target": 1
              }
          })
          .to_string();
          let push_start = serde_json::json!({
              "pushing": {"sequence_id": "20002", "command": "start"}
          })
          .to_string();'''
          s, count = pushall_pattern.subn(new_pushall, s, count=1)
          if count != 1:
              raise SystemExit(f"Could not patch pushall block; matches={count}")

          publish_pattern = re.compile(
              r'let\s+_\s*=\s*mqtt_client_c\s*\.publish\(&req_topic,\s*QoS::AtMostOnce,\s*false,\s*pushall\.clone\(\)\)\s*\.await;'
          )
          match = publish_pattern.search(s)
          if not match:
              raise SystemExit("Could not find pushall publish call")
          push_start_publish = '''\n                    let _ = mqtt_client_c
                        .publish(&req_topic, QoS::AtMostOnce, false, push_start.clone())
                        .await;'''
          s = s[:match.end()] + push_start_publish + s[match.end():]
          lib.write_text(s)

          gradle = Path("src-tauri/gen/android/app/build.gradle.kts")
          g = gradle.read_text()
          debug_pattern = re.compile(r'(getByName\("debug"\)\s*\{)')
          g, count = debug_pattern.subn(
              r'\1\n            applicationIdSuffix = ".x2d"\n            versionNameSuffix = "-X2D.1"',
              g,
              count=1,
          )
          if count != 1:
              raise SystemExit(f"Could not patch Android debug build block; matches={count}")
          gradle.write_text(g)

          strings = Path("src-tauri/gen/android/app/src/main/res/values/strings.xml")
          x = strings.read_text().replace("Bamboo Mobile", "Bamboo Mobile X2D")
          strings.write_text(x)

          print("X2D MQTT patch applied")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Set up Rust for Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JavaScript dependencies
        run: pnpm install

      - name: Build ARM64 debug APK
        shell: bash
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          pnpm tauri android build --debug --apk --target aarch64 --ci

      - name: Show generated APKs
        if: always()
        run: find src-tauri/gen/android/app/build/outputs -type f -name "*.apk" -print || true

      - name: Upload X2D APK
        uses: actions/upload-artifact@v4
        with:
          name: BambooMobile-X2D-1
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
