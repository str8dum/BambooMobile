name: RideSim Android APK
on:
  push:
    branches: [build/zwift-ridesim-v021]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        if: ${{ hashFiles('ridesim-source.b64') != '' }}
        run: |
          base64 -d ridesim-source.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" | tar -xf -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android platform
        if: ${{ hashFiles('ridesim-source.b64') != '' }}
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        if: ${{ hashFiles('ridesim-source.b64') != '' }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('ridesim-source.b64') != '' }}
        with:
          name: KICKR-SIM-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
