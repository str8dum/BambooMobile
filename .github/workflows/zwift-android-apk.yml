name: KICKR-SIM v0.4.0 Bridge APK
on:
  push:
    branches: [build/zwift-ridesim-v040]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore working v0.2.1 base and apply v0.3.2 updates
        shell: bash
        run: |
          set -euo pipefail
          cat chunk-0*.txt > ridesim-source.b64
          echo "75be623807a7789781627f4e79ab3fc514002d0db9f698b2b8136c262939b07a  ridesim-source.b64" | sha256sum -c -
          mkdir ridesim
          base64 -d ridesim-source.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" | tar -xf - -C ridesim
          echo "1e65e2f56625ee0da245676c4173582fb0d2f3f2773fd62ca927752e5fdeec42  ride-v031-patch.b64" | sha256sum -c -
          base64 -d ride-v031-patch.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" > ride-v031.patch
          # GitHub checkout is a repository, so apply the patch from the root
          # with an explicit directory prefix (otherwise git silently skips it).
          git apply --check --directory=ridesim ride-v031.patch
          git apply --verbose --directory=ridesim ride-v031.patch
          test -f ridesim/app/src/main/java/com/ridesim/zwift/FtmsPackets.java
          grep -q cadencePowerGain ridesim/app/src/main/java/com/ridesim/zwift/SimEngine.java
          echo "dae5d39f6e4535d7b2174008d3269b573cf6fb936cdfaa46a4abf8f3a861625e  ride-v032-patch.b64" | sha256sum -c -
          base64 -d ride-v032-patch.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" > ride-v032.patch
          git apply --check --directory=ridesim ride-v032.patch
          git apply --verbose --directory=ridesim ride-v032.patch
          grep -q "powerControl.addView" ridesim/app/src/main/java/com/ridesim/zwift/MainActivity.java
          grep -q "versionName '0.3.2'" ridesim/app/build.gradle
          echo "9df62e1e74670f740790fa1def854ab5688305949fb05a9ed8d09ff11696b48c  ride-v033-icon-overlay.b64" | sha256sum -c -
          base64 -d ride-v033-icon-overlay.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" | tar -xf - -C ridesim
          grep -q 'android:icon="@mipmap/ic_launcher"' ridesim/app/src/main/AndroidManifest.xml
          grep -q "versionName '0.3.3'" ridesim/app/build.gradle
          test -s ridesim/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "868c4becc5f1849e64477bded3c7e40ec4c89e38b907ab2b44f24776bf99952c  ride-v040-patch.b64" | sha256sum -c -
          base64 -d ride-v040-patch.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" > ride-v040.patch
          git apply --check --directory=ridesim ride-v040.patch
          git apply --verbose --directory=ridesim ride-v040.patch
          grep -q "versionName '0.4.0'" ridesim/app/build.gradle
          grep -q "bridgeMultiplierPercent" ridesim/app/src/main/java/com/ridesim/zwift/SimEngine.java
          test -f ridesim/app/src/main/java/com/ridesim/zwift/KickrClient.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$TOOL" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile pure-Java simulation
        working-directory: ridesim
        shell: bash
        run: |
          mkdir -p build/selftest
          javac -d build/selftest app/src/main/java/com/ridesim/zwift/SimEngine.java app/src/main/java/com/ridesim/zwift/BlePackets.java app/src/main/java/com/ridesim/zwift/FtmsPackets.java app/src/main/java/com/ridesim/zwift/KickrPackets.java
      - name: Build installable Android APK
        working-directory: ridesim
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KICKR-SIM-v0.4.0-Bridge-debug-APK
          path: ridesim/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
