name: Rich Kickr v0.6.7 FTMS Range Fix APK
on:
  push:
    branches: [build/zwift-ridesim-v067]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore working v0.2.1 base and apply v0.3.2 updates
        shell: bash
        run: |
          set -euo pipefail
          cat chunk-0*.txt > ridesim-source.b64
          echo "75be623807a7789781627f4e79ab3fc514002d0db9f698b2b8136c262939b07a  ridesim-source.b64" | sha256sum -c -
          mkdir ridesim
          base64 -d ridesim-source.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" | tar -xf - -C ridesim
          echo "1e65e2f56625ee0da245676c4173582fb0d2f3f2773fd62ca927752e5fdeec42  ride-v031-patch.b64" | sha256sum -c -
          base64 -d ride-v031-patch.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" > ride-v031.patch
          # GitHub checkout is a repository, so apply the patch from the root
          # with an explicit directory prefix (otherwise git silently skips it).
          git apply --check --directory=ridesim ride-v031.patch
          git apply --verbose --directory=ridesim ride-v031.patch
          test -f ridesim/app/src/main/java/com/ridesim/zwift/FtmsPackets.java
          grep -q cadencePowerGain ridesim/app/src/main/java/com/ridesim/zwift/SimEngine.java
          echo "dae5d39f6e4535d7b2174008d3269b573cf6fb936cdfaa46a4abf8f3a861625e  ride-v032-patch.b64" | sha256sum -c -
          base64 -d ride-v032-patch.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" > ride-v032.patch
          git apply --check --directory=ridesim ride-v032.patch
          git apply --verbose --directory=ridesim ride-v032.patch
          grep -q "powerControl.addView" ridesim/app/src/main/java/com/ridesim/zwift/MainActivity.java
          grep -q "versionName '0.3.2'" ridesim/app/build.gradle
          echo "9df62e1e74670f740790fa1def854ab5688305949fb05a9ed8d09ff11696b48c  ride-v033-icon-overlay.b64" | sha256sum -c -
          base64 -d ride-v033-icon-overlay.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" | tar -xf - -C ridesim
          grep -q 'android:icon="@mipmap/ic_launcher"' ridesim/app/src/main/AndroidManifest.xml
          grep -q "versionName '0.3.3'" ridesim/app/build.gradle
          test -s ridesim/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "868c4becc5f1849e64477bded3c7e40ec4c89e38b907ab2b44f24776bf99952c  ride-v040-patch.b64" | sha256sum -c -
          base64 -d ride-v040-patch.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" > ride-v040.patch
          git apply --check --directory=ridesim ride-v040.patch
          git apply --verbose --directory=ridesim ride-v040.patch
          grep -q "versionName '0.4.0'" ridesim/app/build.gradle
          grep -q "bridgeMultiplierPercent" ridesim/app/src/main/java/com/ridesim/zwift/SimEngine.java
          test -f ridesim/app/src/main/java/com/ridesim/zwift/KickrClient.java
          echo "92ec702c12d41a18c4b0917d4852153192d0e1c96e4b6d2e16079156dab9d010  ride-v050-patch.b64" | sha256sum -c -
          base64 -d ride-v050-patch.b64 | gzip -dc > ride-v050.patch
          git apply --check --directory=ridesim ride-v050.patch
          git apply --verbose --directory=ridesim ride-v050.patch
          test -f ridesim/app/src/main/java/com/ridesim/zwift/ZwiftGradeClient.java
          grep -q "versionName '0.5.0'" ridesim/app/build.gradle
          echo "af8768afdbc368b7c7cc14bcee1a1ec3b88ab78f0fbc6be149aa1e07c01bca28  ride-v060-ui-patch.b64" | sha256sum -c -
          base64 -d ride-v060-ui-patch.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" > ride-v060.patch
          patch --batch --forward --fuzz=0 -p1 -d ridesim < ride-v060.patch
          grep -q "versionName '0.6.0'" ridesim/app/build.gradle
          grep -q 'private void showHome()' ridesim/app/src/main/java/com/ridesim/zwift/MainActivity.java
          grep -q 'private void showRidePage(boolean bridgeMode)' ridesim/app/src/main/java/com/ridesim/zwift/MainActivity.java
          echo "c7064a09e9703eb2534c817cf64c28b0f34bf6ca6a3082bada84a5e19311f0ff  ride-v061-ui.patch.b64" | sha256sum -c -
          base64 -d ride-v061-ui.patch.b64 | gzip -dc > ride-v061.patch
          patch --batch --forward --fuzz=0 -p1 -d ridesim < ride-v061.patch
          grep -q "versionName '0.6.1'" ridesim/app/build.gradle
          test -s ridesim/tools/GenerateLauncherIcons.java
          echo "5bf2f9ef177786f499cda3a72dd90c0ec0b7377f37a3e7b0284194446eab811b  ride-v062-build-patch.b64" | sha256sum -c -
          base64 -d ride-v062-build-patch.b64 | gzip -dc > ride-v062.patch
          patch --batch --forward --fuzz=0 -p1 -d ridesim < ride-v062.patch
          grep -q "versionName '0.6.2'" ridesim/app/build.gradle
          grep -q 'hillBoostFraction' ridesim/app/src/main/java/com/ridesim/zwift/SimEngine.java
          echo "a901ad7436f2bbc9e54d9d0eb0be98c10665c991b12a5c04fc9a37969cd927b6  ride-v064-build-patch.b64" | sha256sum -c -
          base64 -d ride-v064-build-patch.b64 | gzip -dc > ride-v064.patch
          patch --batch --forward --fuzz=0 -p1 -d ridesim < ride-v064.patch
          grep -q "versionName '0.6.4'" ridesim/app/build.gradle
          grep -q 'nextWanderChangeSec' ridesim/app/src/main/java/com/ridesim/zwift/SimEngine.java
          echo "4971e99f875d9feebf39a3667a979e53fc239c596ff1a211f3b53085f19fccce  ride-v065-patch.b64" | sha256sum -c -
          base64 -d ride-v065-patch.b64 | gzip -dc > ride-v065.patch
          patch --batch --forward --fuzz=0 -p1 -d ridesim < ride-v065.patch
          sed -i "s/versionCode 14/versionCode 15/; s/versionName '0.6.4'/versionName '0.6.5'/" ridesim/app/build.gradle
          grep -q "versionCode 15" ridesim/app/build.gradle
          grep -q "versionName '0.6.5'" ridesim/app/build.gradle
          grep -q 'Rich Kickr' ridesim/app/src/main/java/com/ridesim/zwift/BlePeripheral.java
          grep -q 'HILL BOOST' ridesim/app/src/main/java/com/ridesim/zwift/MainActivity.java
          echo "0b46ff96a505529c3dd1faa07a2548f9742e35ac50e7ab4a8b4c9dca320009ef  ride-v066-ftms-diagnostic-patch.b64" | sha256sum -c -
          base64 -d ride-v066-ftms-diagnostic-patch.b64 | gzip -dc > ride-v066.patch
          patch --batch --forward --fuzz=0 -p1 -d ridesim < ride-v066.patch
          sed -i "s/versionCode 15/versionCode 16/; s/versionName '0.6.5'/versionName '0.6.6'/" ridesim/app/build.gradle
          grep -q "versionCode 16" ridesim/app/build.gradle
          grep -q 'ftmsDiagnostics' ridesim/app/src/main/java/com/ridesim/zwift/BlePeripheral.java
          echo "d29d7ca8557a7f1f37e963cd6b89a84f6a69e261761be55fdb6c7a9ec2b6ee71  ride-v067-ftms-inclination-patch.b64" | sha256sum -c -
          base64 -d ride-v067-ftms-inclination-patch.b64 | gzip -dc > ride-v067.patch
          patch --batch --forward --fuzz=0 -p1 -d ridesim < ride-v067.patch
          sed -i "s/versionCode 16/versionCode 17/; s/versionName '0.6.6'/versionName '0.6.7'/" ridesim/app/build.gradle
          grep -q "versionCode 17" ridesim/app/build.gradle
          grep -q 'FTMS_INCLINATION_RANGE' ridesim/app/src/main/java/com/ridesim/zwift/BlePeripheral.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate full-size adaptive and legacy launcher icons
        working-directory: ridesim
        run: |
          javac tools/GenerateLauncherIcons.java
          java -cp tools GenerateLauncherIcons app/src/main/res
          test -s app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test -s app/src/main/res/drawable-nodpi/ic_launcher_art.png
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          TOOL="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          "$TOOL" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile pure-Java simulation
        working-directory: ridesim
        shell: bash
        run: |
          mkdir -p build/selftest
          javac -d build/selftest app/src/main/java/com/ridesim/zwift/SimEngine.java app/src/main/java/com/ridesim/zwift/BlePackets.java app/src/main/java/com/ridesim/zwift/FtmsPackets.java app/src/main/java/com/ridesim/zwift/KickrPackets.java tools/HillCurveTest.java tools/HillFloorTest.java tools/FtmsControlTest.java
          java -cp build/selftest com.ridesim.zwift.HillCurveTest
          java -cp build/selftest com.ridesim.zwift.HillFloorTest
          java -cp build/selftest com.ridesim.zwift.FtmsControlTest
      - name: Build installable Android APK
        working-directory: ridesim
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Package Android APK signing utility for private offline release signing
        run: |
          test -s "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" ./apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Rich-Kickr-v0.6.7-apksigner-tool
          path: apksigner.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Rich-Kickr-v0.6.7-Debug-APK
          path: ridesim/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
