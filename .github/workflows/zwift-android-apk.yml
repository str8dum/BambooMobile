name: RideSim Android APK
on:
  push:
    branches: [build/zwift-ridesim-v021]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore RideSim sources
        run: |
          set -euo pipefail
          cat chunk-0*.txt > ridesim-source.b64
          echo "75be623807a7789781627f4e79ab3fc514002d0db9f698b2b8136c262939b07a  ridesim-source.b64" | sha256sum -c -
          mkdir ridesim
          base64 -d ridesim-source.b64 | node -e "const fs=require('fs'),z=require('zlib');process.stdout.write(z.brotliDecompressSync(fs.readFileSync(0)))" | tar -xf - -C ridesim
          test -f ridesim/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK platform
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK
        working-directory: ridesim
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: KICKR-SIM-APK
          path: ridesim/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
